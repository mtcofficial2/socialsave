name: flutter_local_notifications_windows
description: Local copy of flutter_local_notifications_windows 1.0.3 without the native C++ part (it needs Visual Studio ATL, which this PC does not have). Windows toasts are skipped; Android is unaffected.
version: 1.0.3
publish_to: none

environment:
  sdk: ^3.4.0
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter
  ffi: ^2.1.2
  flutter_local_notifications_platform_interface: ^9.0.0
  meta: ^1.11.0
  timezone: ^0.10.0
  xml: ^6.5.0

flutter:
  plugin:
    implements: flutter_local_notifications
    platforms:
      windows:
        dartPluginClass: FlutterLocalNotificationsWindows
