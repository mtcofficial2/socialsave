name: social_save
description: SocialSave - a compliant social media video downloader and manager.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.6.1
  go_router: ^16.2.4
  dio: ^5.9.0
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  shared_preferences: ^2.5.3
  path_provider: ^2.1.5
  permission_handler: ^12.0.1
  share_plus: ^11.1.0
  connectivity_plus: ^6.1.5
  cached_network_image: ^3.4.1
  flutter_cache_manager: ^3.4.1
  uuid: ^4.5.1
  open_filex: ^4.7.0
  flutter_local_notifications: ^19.4.2
  path: ^1.9.1
  equatable: ^2.0.7
  intl: ^0.20.2
  collection: ^1.19.1
  google_fonts: ^6.2.1
  flutter_svg: ^2.1.0
  video_player: ^2.10.0
  wakelock_plus: ^1.3.2
  media_kit: ^1.1.11
  media_kit_video: ^1.2.5
  media_kit_libs_android_video: ^1.3.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  mocktail: ^1.0.4

flutter:
  uses-material-design: true
  assets:
    - assets/legal/
    - assets/config/
    - assets/brand/
    - assets/platforms/
