name: Keep the API awake

on:
  schedule:
    # Free hosts often sleep after a few minutes with no requests.
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Request the health check
        env:
          HEALTH_URL: ${{ secrets.HEALTH_URL }}
        run: |
          if [ -z "$HEALTH_URL" ]; then
            echo "HEALTH_URL is not set. Skipping."
            exit 0
          fi
          curl --fail --silent --show-error --retry 2 --retry-delay 15 --retry-all-errors --max-time 90 "$HEALTH_URL"
