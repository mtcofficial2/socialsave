name: Keep the API awake

on:
  schedule:
    # Render's free plan sleeps after 15 minutes with no requests.
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Request the health check
        run: curl --fail --silent --show-error --retry 2 --retry-delay 15 --retry-all-errors --max-time 90 "https://socialsave-api-p2tm.onrender.com/health"
