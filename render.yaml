services:
  - type: web
    name: socialsave-api
    runtime: docker
    plan: free
    rootDir: backend
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: REQUIRE_API_KEY
        value: "false"
      - key: SECRET_KEY
        generateValue: true
      - key: MAX_DOWNLOAD_BYTES
        value: "2147483647"
      - key: DEFAULT_MAX_HEIGHT
        value: "1080"
      - key: JOB_TTL_SECONDS
        value: "600"
      - key: ANYAPI_KEY
        sync: false
