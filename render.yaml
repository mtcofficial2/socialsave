services:
  - type: web
    name: socialsave-api
    runtime: docker
    plan: free
    rootDir: backend
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: REQUIRE_API_KEY
        value: "false"
      - key: SECRET_KEY
        generateValue: true
      - key: MAX_DOWNLOAD_BYTES
        value: "2147483647"
      - key: JOB_TTL_SECONDS
        value: "600"
      - key: S3_ENDPOINT
        sync: false
      - key: S3_REGION
        value: auto
      - key: S3_BUCKET
        sync: false
      - key: S3_ACCESS_KEY_ID
        sync: false
      - key: S3_SECRET_ACCESS_KEY
        sync: false
      - key: S3_URL_TTL_SECONDS
        value: "3600"
