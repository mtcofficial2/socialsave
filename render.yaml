services:
  - type: web
    name: socialsave-api
    runtime: docker
    plan: free
    rootDir: backend
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: REQUIRE_API_KEY
        value: "false"
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: MAX_DOWNLOAD_BYTES
        value: "104857600"
      - key: DEFAULT_MAX_HEIGHT
        value: "480"
      - key: JOB_TTL_SECONDS
        value: "600"
