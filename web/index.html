<!DOCTYPE html>
<html lang="en">
<head>
  <base href="$FLUTTER_BASE_HREF">
  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="SocialSave: paste a public video link and save it. Public and allowed content only.">
  <meta name="theme-color" content="#0B1219">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="SocialSave">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <link rel="icon" type="image/png" href="favicon.png"/>
  <title>SocialSave</title>
  <link rel="manifest" href="manifest.json">
  <style>
    html, body { margin: 0; height: 100%; background: #0B1219; }
    @media (prefers-color-scheme: light) { html, body { background: #FAF8FF; } }
    #splash { position: fixed; inset: 0; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 18px;
      font-family: Inter, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      color: #AAB6C8; transition: opacity .25s ease; }
    #splash img { width: 72px; height: 72px; border-radius: 18px; }
    #splash .bar { width: 120px; height: 4px; border-radius: 4px; background: #1B2433; overflow: hidden; }
    #splash .bar i { display: block; width: 40%; height: 100%; background: #80D5CB;
      border-radius: 4px; animation: slide 1.1s ease-in-out infinite; }
    @keyframes slide { 0% { transform: translateX(-100%); } 100% { transform: translateX(250%); } }
  </style>
</head>
<body>
  <div id="splash" aria-label="Loading SocialSave">
    <img src="icons/Icon-192.png" alt="">
    <div style="font-weight:700;font-size:18px;color:#80D5CB">SocialSave</div>
    <div class="bar"><i></i></div>
  </div>
  <script>
    window.addEventListener('flutter-first-frame', function () {
      var s = document.getElementById('splash');
      if (!s) return;
      s.style.opacity = '0';
      setTimeout(function () { s.remove(); }, 300);
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
